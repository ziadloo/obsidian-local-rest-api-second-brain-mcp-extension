name: Release Obsidian plugin

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - "*" # Push events to any matching tag (e.g. 1.0.2)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Build standard plugin
        run: |
          npm install
          npm run build
          mkdir standard-release
          cp main.js manifest.json styles.css standard-release/

      - name: Build native plugin
        run: |
          npm run build:native
          mkdir obsidian-local-rest-api-second-brain-mcp-extension-native
          cp main.js manifest.json styles.css obsidian-local-rest-api-second-brain-mcp-extension-native/
          
          # Prune devDependencies so the zip isn't massive
          npm ci --omit=dev
          cp -r node_modules obsidian-local-rest-api-second-brain-mcp-extension-native/
          
      - name: Package native zip
        run: |
          tag_name="${GITHUB_REF#refs/tags/}"
          zip -r "obsidian-local-rest-api-second-brain-mcp-extension-native-${tag_name}.zip" obsidian-local-rest-api-second-brain-mcp-extension-native/

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag_name="${GITHUB_REF#refs/tags/}"
          gh release create "$tag_name" \
            --title="$tag_name" \
            --draft=false \
            --prerelease=false \
            standard-release/main.js \
            standard-release/manifest.json \
            standard-release/styles.css \
            "obsidian-local-rest-api-second-brain-mcp-extension-native-${tag_name}.zip"
